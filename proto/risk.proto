syntax = "proto3";

package mm.risk;

import "common.proto";

// Risk management service.
service RiskService {
  // Evaluate whether an order should be allowed, rejected, or reduced.
  rpc EvaluateOrder(EvaluateOrderRequest) returns (EvaluateOrderResponse);

  // Get the current portfolio risk summary.
  rpc GetPortfolioRisk(GetPortfolioRiskRequest) returns (GetPortfolioRiskResponse);

  // Activate the global kill switch.
  rpc ActivateKillSwitch(ActivateKillSwitchRequest) returns (KillSwitchResponse);

  // Reset the kill switch.
  rpc ResetKillSwitch(ResetKillSwitchRequest) returns (KillSwitchResponse);

  // Get the current kill switch status.
  rpc GetKillSwitchStatus(GetKillSwitchStatusRequest) returns (KillSwitchResponse);
}

message EvaluateOrderRequest {
  mm.common.Exchange exchange = 1;
  mm.common.Symbol symbol = 2;
  mm.common.Side side = 3;
  mm.common.OrderType order_type = 4;
  string price = 5;
  string quantity = 6;
  string strategy_id = 7;
}

message EvaluateOrderResponse {
  // The risk engine decision.
  RiskAction action = 1;
  // Reason for the decision (if not Allow).
  string reason = 2;
  // If action is REDUCE_SIZE, the maximum allowed quantity.
  string max_quantity = 3;
}

enum RiskAction {
  RISK_ACTION_UNSPECIFIED = 0;
  RISK_ACTION_ALLOW = 1;
  RISK_ACTION_REJECT = 2;
  RISK_ACTION_REDUCE_SIZE = 3;
  RISK_ACTION_KILL_SWITCH = 4;
}

message GetPortfolioRiskRequest {}

message GetPortfolioRiskResponse {
  mm.common.PortfolioRisk risk = 1;
}

message ActivateKillSwitchRequest {
  string reason = 1;
}

message ResetKillSwitchRequest {}

message GetKillSwitchStatusRequest {}

message KillSwitchResponse {
  bool active = 1;
  int64 timestamp_ms = 2;
}
