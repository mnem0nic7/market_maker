# =============================================================================
# trading-core default configuration
# =============================================================================
#
# This file provides baseline settings for the trading-core binary.
# Every value here can be overridden by environment variables prefixed with
# MM_ using double-underscore as a separator.
#
# Example:
#   MM_EXCHANGES__BINANCE__API_KEY=abc123
#   MM_GATEWAY__PORT=9090
#   MM_TRADING_LOOP__TICK_INTERVAL_MS=200

# =============================================================================
# Exchange connections
# =============================================================================
# Each exchange section is keyed by lowercase name. Only exchanges with
# enabled = true will have their connectors initialized.

[exchanges.binance]
api_key = "your-api-key-here"
secret_key = "your-secret-key-here"
enabled = false
symbols = ["BTC/USDT", "ETH/USDT"]

[exchanges.coinbase]
api_key = "your-api-key-here"
secret_key = "your-secret-key-here"
enabled = false
symbols = ["BTC/USD", "ETH/USD"]

[exchanges.kraken]
api_key = "your-api-key-here"
secret_key = "your-secret-key-here"
enabled = false
symbols = ["BTC/USD", "ETH/USD"]

[exchanges.alpaca]
api_key = "your-alpaca-key-id"
secret_key = "your-alpaca-secret-key"
enabled = false
symbols = ["AAPL/USD", "MSFT/USD", "TSLA/USD"]

[exchanges.interactive_brokers]
api_key = ""
secret_key = ""
enabled = false
symbols = ["AAPL/USD", "SPY/USD"]

[exchanges.uniswap]
api_key = ""
secret_key = ""
enabled = false
symbols = ["WETH/USDC", "WETH/USDT"]

[exchanges.raydium]
api_key = ""
secret_key = ""
enabled = false
symbols = ["SOL/USDC", "SOL/USDT"]

# =============================================================================
# Strategy instances
# =============================================================================
# Each [[strategies]] entry creates one strategy instance. Supported types:
#   - "spread"     : Basic symmetric spread market making.
#   - "avellaneda" : Avellaneda-Stoikov inventory-aware market making.
#   - "grid"       : Grid trading within a price range.
#   - "twap"       : Time-weighted average price execution.
#   - "vwap"       : Volume-weighted average price execution.
#   - "momentum"   : Trend-following directional strategy.
#   - "mean_reversion" : Bollinger Band-style directional strategy.
#   - "stat_arb"   : Statistical arbitrage across correlated instruments.
#
# The "params" table is passed directly to the strategy constructor. Its
# schema depends on the strategy_type. The strategy_id, exchange, and symbol
# fields in the outer section take precedence over anything in params.
# The dashboard create flow currently supports the single-symbol strategies.
# `stat_arb` is seeded here as a pair template and started from the
# Strategies panel until a dedicated multi-leg editor exists.

[[strategies]]
strategy_id = "spread-aapl-alpaca-paper"
strategy_type = "spread"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Half-spread in basis points for the innermost level.
spread_bps = "12"
# Order quantity per level (fractional shares are supported on Alpaca paper).
order_size = "1"
# Number of price levels on each side of the book.
num_levels = 1
# Minimum ms between full order refreshes.
refresh_interval_ms = 1000
# Floor for the spread in basis points.
min_spread_bps = "6"
# Mid-price movement (bps) that triggers a cancel-and-replace cycle.
reprice_threshold_bps = "4"

[[strategies]]
strategy_id = "mean_reversion-aapl-alpaca-paper"
strategy_type = "mean_reversion"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Number of recent mid-price observations used for the rolling band window.
window_periods = 30
# Standard-deviation multiplier for the Bollinger-style entry/exit bands.
num_std_dev = "2.5"
# Order quantity per signal (fractional shares are supported on Alpaca paper).
order_size = "1"
# Maximum absolute inventory this strategy is allowed to hold.
max_position = "1"
# Exit when price reverts back to the rolling mean.
exit_at_mean = true

[[strategies]]
strategy_id = "avellaneda-msft-alpaca-paper"
strategy_type = "avellaneda"
exchange = "alpaca"
symbol = "MSFT/USD"
enabled = false

[strategies.params]
# Higher values lean harder against inventory accumulation.
gamma = "0.15"
# Session volatility estimate used by the reservation-price model.
sigma = "0.02"
# Liquidity parameter for optimal spread sizing.
kappa = "1.5"
# Order quantity per side (fractional shares are supported on Alpaca paper).
order_size = "1"
# Maximum absolute inventory this strategy is allowed to hold.
max_position = "1"
# Session length in seconds used for time-decay in the model.
session_duration_secs = 3600

[[strategies]]
strategy_id = "grid-aapl-alpaca-paper"
strategy_type = "grid"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Starter AAPL band for paper testing; tune this to the current regime.
upper_price = "250"
lower_price = "150"
# Number of intervals across the grid range.
num_grids = 10
# Order quantity per grid level.
order_size = "1"
# Grid spacing model.
grid_type = "Arithmetic"

[[strategies]]
strategy_id = "twap-aapl-buy-alpaca-paper"
strategy_type = "twap"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Total quantity to execute across the full schedule.
target_quantity = "1"
# Execution window in seconds.
duration_secs = 3600
# Time between child slices in seconds.
slice_interval_secs = 300
# Execution direction.
side = "Buy"
# Maximum price deviation from mid for each slice, in basis points.
max_deviation_bps = "10"

[[strategies]]
strategy_id = "vwap-aapl-buy-alpaca-paper"
strategy_type = "vwap"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Total quantity to execute across the full schedule.
target_quantity = "1"
# Execution window in seconds.
duration_secs = 3600
# Execution direction.
side = "Buy"
# Relative volume weights for each execution bucket.
volume_profile = ["1", "2", "3", "2", "1"]
# Maximum price deviation from mid for each slice, in basis points.
max_deviation_bps = "10"

[[strategies]]
strategy_id = "momentum-msft-alpaca-paper"
strategy_type = "momentum"
exchange = "alpaca"
symbol = "MSFT/USD"
enabled = false

[strategies.params]
# Number of recent prices used to measure momentum.
lookback_periods = 20
# Entry threshold in basis points.
entry_threshold_bps = "50"
# Exit threshold in basis points.
exit_threshold_bps = "15"
# Order quantity per signal.
order_size = "1"
# Trailing-stop distance in basis points.
trailing_stop_bps = "30"
# Maximum absolute inventory this strategy is allowed to hold.
max_position = "1"

[[strategies]]
strategy_id = "stat_arb-aapl-msft-alpaca-paper"
strategy_type = "stat_arb"
exchange = "alpaca"
symbol = "AAPL/USD"
enabled = false

[strategies.params]
# Pair-trading templates keep their canonical leg definitions in params. The
# outer exchange/symbol fields remain compatibility placeholders for the
# generic StrategyConfig envelope.
leg_a_exchange = "Alpaca"
leg_b_exchange = "Alpaca"
# Number of recent spread observations used for z-score computation.
lookback_periods = 50
# Entry z-score threshold.
entry_z_score = "2.0"
# Exit z-score threshold; must stay below entry_z_score.
exit_z_score = "0.5"
# Order quantity per signal on leg A.
order_size = "1"
# Maximum absolute exposure this strategy is allowed to carry.
max_position = "1"

[strategies.params.leg_a_symbol]
base = "AAPL"
quote = "USD"

[strategies.params.leg_b_symbol]
base = "MSFT"
quote = "USD"

# =============================================================================
# Risk management
# =============================================================================

[risk.position_limits]
# Maximum absolute position for any single symbol.
max_position_per_symbol = "10"
# Maximum total gross notional exposure across all positions.
max_gross_exposure = "500000"

[risk.order_limits]
# Maximum quantity for a single order.
max_order_quantity = "1"
# Maximum notional value (price * quantity) for a single order.
max_order_notional = "100000"

[risk.pnl_limits]
# Maximum daily loss (positive number). Kill switch fires when
# daily_pnl <= -max_daily_loss.
max_daily_loss = "10000"
# Maximum drawdown as a decimal fraction (0.05 = 5%).
max_drawdown_pct = "0.05"

[risk.rate_limits]
# Maximum order submissions per second per exchange.
max_orders_per_second = 10
# Maximum order submissions per minute per exchange.
max_orders_per_minute = 200

[risk.kill_switch]
# Maximum daily loss before global kill switch fires.
max_daily_loss = "10000"
# Maximum position per symbol before kill switch fires.
max_position_per_symbol = "100"
# Seconds an exchange can be disconnected before kill switch fires.
exchange_disconnect_timeout_secs = 30
# Seconds without an internal heartbeat before kill switch fires.
heartbeat_timeout_secs = 10

# =============================================================================
# NATS event streaming
# =============================================================================
# When enabled, all system events (orders, fills, risk, strategy signals)
# are published to NATS JetStream for persistence, audit, and replay.

[nats]
enabled = false
url = "nats://127.0.0.1:4222"
stream_name = "EVENTS"
# Maximum message age in seconds (0 = unlimited).
max_age_secs = 0
# Maximum total bytes in the stream (0 = unlimited).
max_bytes = 0

# =============================================================================
# REST / WebSocket gateway
# =============================================================================
# The gateway exposes a REST API for querying positions, orders, and risk,
# and a WebSocket endpoint for real-time dashboard updates.

[gateway]
enabled = true
host = "127.0.0.1"
port = 8080
# CORS origins (empty = no CORS; use ["*"] for development).
cors_origins = []
# Bearer token for API authentication (empty = no auth).
api_token = ""
# Maximum API requests per second (global rate limit). Set to 0 to disable.
rate_limit_rps = 100

# =============================================================================
# Research agent (autonomous financial research with tool calling)
# =============================================================================
# The research agent runs multi-step research queries using LLM + tools.
# It can autonomously gather financial data, search the web, and produce
# research reports with access to live trading state.

[research]
enabled = true
# Maximum agentic iterations per query (each iteration may call one tool).
max_iterations = 10
# Maximum output tokens per LLM turn.
max_tokens_per_turn = 4096
# Estimated token count at which the agent compacts its scratchpad context.
context_token_threshold = 80000
# LLM provider: "anthropic" or "openai".
llm_provider = "anthropic"
# Model name (e.g. "claude-sonnet-4-20250514", "gpt-4o").
llm_model = "claude-sonnet-4-20250514"
# API keys — set via environment variables for security:
#   MM_RESEARCH__ANTHROPIC_API_KEY, MM_RESEARCH__OPENAI_API_KEY
anthropic_api_key = ""
openai_api_key = ""
# Financial data API key (financialdatasets.ai).
#   MM_RESEARCH__FINANCIAL_DATA_API_KEY
financial_data_api_key = ""
# Web search API keys (first available is used: Exa > Perplexity > Tavily).
#   MM_RESEARCH__EXA_API_KEY, MM_RESEARCH__PERPLEXITY_API_KEY, MM_RESEARCH__TAVILY_API_KEY
exa_api_key = ""
perplexity_api_key = ""
tavily_api_key = ""
# Directories to scan for SKILL.md / *.skill.md files.
skill_dirs = ["skills"]

# =============================================================================
# Main trading loop
# =============================================================================

[trading_loop]
# Interval in milliseconds between strategy tick evaluations.
# Lower values provide faster reaction times but increase CPU load
# and order submission rate. 100ms is a reasonable starting point.
tick_interval_ms = 100
# Maximum age in milliseconds for an order book to be considered fresh.
# Books older than this threshold are skipped to prevent trading on stale data.
order_book_stale_ms = 5000
