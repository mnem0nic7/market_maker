version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # NATS with JetStream
  # ---------------------------------------------------------------------------
  nats:
    image: nats:latest
    container_name: mm-nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP management / monitoring
    command: >
      --jetstream
      --store_dir /data
      --max_mem_store 256MB
      --max_file_store 1GB
      --http_port 8222
    volumes:
      - nats-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # TimescaleDB (PostgreSQL with TimescaleDB extension)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mm-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_maker
    volumes:
      - timescale-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: mm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - nats

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: mm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # trading-core — Hot-path trading engine
  # ---------------------------------------------------------------------------
  trading-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mm-trading-core
    command: ["trading-core"]
    volumes:
      - ../config:/app/config:ro
    env_file:
      - ../.env
    environment:
      # Point NATS at the container hostname instead of localhost.
      MM_NATS__URL: "nats://nats:4222"
      MM_NATS__ENABLED: "true"
      # Exchange credentials are loaded from .env via env_file above.
      # Bind gateway (embedded) to all interfaces inside the container.
      MM_GATEWAY__HOST: "0.0.0.0"
    depends_on:
      nats:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # gateway — REST / WebSocket API server
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mm-gateway
    command: ["gateway"]
    ports:
      - "8080:8080"
    volumes:
      - ../config:/app/config:ro
    env_file:
      - ../.env
    environment:
      MM_NATS__URL: "nats://nats:4222"
      MM_NATS__ENABLED: "true"
      MM_GATEWAY__HOST: "0.0.0.0"
      MM_GATEWAY__PORT: "8080"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # data-pipeline — Event consumer, TimescaleDB persistence, audit logger
  # ---------------------------------------------------------------------------
  data-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mm-data-pipeline
    command: ["data-pipeline"]
    volumes:
      - ../config:/app/config:ro
    env_file:
      - ../.env
    environment:
      MM_NATS__URL: "nats://nats:4222"
      MM_NATS__ENABLED: "true"
      DATABASE_URL: "postgresql://postgres:postgres@timescaledb:5432/market_maker"
    depends_on:
      nats:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  nats-data:
    driver: local
  timescale-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
